name: Render harness

# Manual run only: renders the same 15-second ride with the vector and the
# raster map, encodes both with the app's H264Encoder and uploads the
# per-frame byte comparison (summary.md), the .h264 streams and sample PNG
# frames as an artifact. It fetches live tiles (OpenFreeMap + OSM), so it
# is not part of the push CI. See TripperDashPPTests/RenderHarnessTests.swift.

on:
  workflow_dispatch:

jobs:
  harness:
    name: vector vs raster on the wire
    runs-on: macos-15
    timeout-minutes: 30

    env:
      PROJECT: TripperDashPP/TripperDashPP.xcodeproj
      SCHEME: TripperDashPP

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select latest stable Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|release_candidate|_rc' | sort -V | tail -1)/Contents/Developer"
          xcodebuild -version

      - name: Resolve a concrete iOS Simulator destination
        id: dest
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; \
                 devs=[x for r in d.values() for x in r if 'iPhone' in x['name']]; \
                 print(devs[-1]['udid'] if devs else '')")
          if [ -z "$UDID" ]; then echo "No iPhone simulator available" >&2; exit 1; fi
          echo "destination=platform=iOS Simulator,id=$UDID" >> "$GITHUB_OUTPUT"

      - name: Run the harness
        env:
          TEST_RUNNER_TDPP_RENDER_HARNESS: "1"
          TEST_RUNNER_TDPP_RENDER_OUT: ${{ github.workspace }}/render-harness
        run: |
          set -o pipefail
          mkdir -p "$TEST_RUNNER_TDPP_RENDER_OUT"
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "${{ steps.dest.outputs.destination }}" \
            -only-testing:TripperDashPPTests/RenderHarnessTests \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
          cat "$TEST_RUNNER_TDPP_RENDER_OUT/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-harness
          path: render-harness/
